<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EvoTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* CSS ESPECIAL SÓ PARA O LOGIN */
        body {
            background: radial-gradient(circle, #1F2937 0%, #121212 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .logo-img {
            max-width: 250px;
            margin-bottom: 40px;
            /* Se não tiver a logo ainda, o texto "EvoTracker" vai aparecer bonito */
            font-size: 2rem; 
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
        }

        .custom-input {
            background-color: #2C2C2C !important;
            border: 1px solid #444 !important;
            color: white !important;
            border-radius: 25px !important;
            padding: 15px !important;
            text-align: center;
            transition: 0.3s;
        }

        .custom-input:focus {
            background-color: #2C2C2C !important;
            border-color: #00E676 !important; /* Verde Neon */
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3) !important;
            color: white !important;
        }

        .custom-input::placeholder {
            color: #888 !important;
        }

        .btn-neon {
            background-color: #00B0FF; /* Azul Neon */
            color: black;
            font-weight: bold;
            border-radius: 25px;
            padding: 12px;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-neon:hover {
            background-color: #00E5FF;
            box-shadow: 0 0 20px rgba(0, 176, 255, 0.6);
            transform: scale(1.02);
            color: black;
        }

        .footer-text {
            color: #555;
            margin-top: 30px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        
        <div class="mb-4">
            <h1 class="logo-img">Evo<span style="color:#00E676">Tracker</span></h1>
            <p class="text-secondary">Acesse sua evolução</p>
        </div>

        <form action="/login" method="POST">
            <div class="mb-4">
                <input type="text" 
                       name="nome" 
                       class="form-control form-control-lg custom-input" 
                       placeholder="Digite seu nome..." 
                       required 
                       autocomplete="off">
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-neon btn-lg">
                    ENTRAR E EVOLUIR
                </button>
            </div>
        </form>

        <div class="footer-text">
            EvoTracker Pro &copy; 2026 <br>
            <span style="font-size: 10px">Versão Beta 1.0</span>
        </div>
    </div>

</body>
</html>
