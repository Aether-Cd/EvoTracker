<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EvoTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card-login {
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="card card-login shadow-lg text-center">
        <div class="card-header bg-primary text-white">
            <h4>🔐 Acesso Restrito</h4>
        </div>
        <div class="card-body bg-dark">
            <h5 class="mb-4 text-light">Identifique-se, Dev.</h5>
            
            <form action="/login" method="POST">
                <div class="mb-3">
                    <input type="text" name="nome" class="form-control form-control-lg text-center" placeholder="Digite seu nome..." required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-outline-light btn-lg">Entrar no Sistema</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-secondary text-white small">
            EvoTracker Pro &copy; 2025
        </div>
    </div>

</body>
</html>
